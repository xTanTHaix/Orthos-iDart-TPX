[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tpx"
version = "1.0.0"
description = "Self-describing, hardware-accelerated tensor storage engine"
requires-python = ">=3.9"

[project.entry-points."orthos.storage_drivers"]
tpx = "tpx:TPXDatabase"

[tool.maturin]
manifest-path = "crates/tpx-py/Cargo.toml"
module-name = "tpx._native"
python-source = "."
